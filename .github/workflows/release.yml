name: Release

# Gera o instalador do Windows e publica a release quando uma tag vX.Y.Z é enviada.
# A release vai para o repositório público devstack-releases: o código fica privado,
# mas o app instalado precisa baixar o latest.json e os pacotes sem login.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Notas da versão a partir do CHANGELOG
        id: notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" 'index($0, "## [" v "]") == 1 {found=1; next} found && /^## / {exit} found {print}' CHANGELOG.md > release-notes.md
          { echo 'body<<NOTAS'; cat release-notes.md; echo 'NOTAS'; } >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v0
        env:
          # Token com permissão de escrita (Contents) só no devstack-releases.
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          # Assinatura da atualização automática; gera o latest.json junto dos instaladores.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: LucasTrombiniBatista
          repo: devstack-releases
          tagName: ${{ github.ref_name }}
          releaseName: DevStack ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
